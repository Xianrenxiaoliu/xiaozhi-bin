# 云端编译小智固件 → 产出可直接刷写的 merged-binary.bin
name: build-firmware

on:
  workflow_dispatch:
  push:

env:
  XIAOZHI_REPO: https://github.com/78/xiaozhi-esp32.git
  BOARD_NAME: my-s3-28tft

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 定位板级目录并打印文件树
        id: locate
        run: |
          set -eu
          echo "== 仓库文件树（前 4 层）=="
          find . -maxdepth 4 -not -path './.git*' | sort
          echo "=========================="
          for p in \
            "main/boards/${BOARD_NAME}" \
            "xiaozhi-s3-28tft/main/boards/${BOARD_NAME}" \
            "${BOARD_NAME}" ; do
            if [ -d "$p" ]; then
              echo "找到板级目录: $p"
              echo "BOARD_SRC=$p" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::找不到板级目录。请确认上传后仓库里存在 main/boards/${BOARD_NAME}/（5 个文件）。"
          exit 1

      - name: 拉取上游源码并合入板级文件
        run: |
          set -eux
          git clone --depth 1 "$XIAOZHI_REPO" xz
          cp -r "${{ steps.locate.outputs.BOARD_SRC }}" "xz/main/boards/${BOARD_NAME}"
          python3 patch_repo.py xz
          echo "== 补丁检查（两行都要出现）=="
          grep -n "BOARD_TYPE_MY_S3_28TFT" xz/main/Kconfig.projbuild xz/main/CMakeLists.txt

      - name: 编译（ESP-IDF v6.0.2）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: 'xz'
          command: python scripts/build.py my-s3-28tft --language zh-CN --wake-word nihaoxiaozhi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-my-s3-28tft
          path: xz/build/merged-binary.bin
          if-no-files-found: error
